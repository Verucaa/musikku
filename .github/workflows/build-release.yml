name: build-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle dipin di sini (tanpa wrapper jar di repo) — jangan ubah
          # versi tanpa uji build penuh.
          gradle-version: 8.7
      - name: Accept SDK licenses + install platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign APK (jika secrets tersedia)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            APK=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk | head -1)
            echo "Signing $APK"
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/release.jks \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out app/build/outputs/apk/release/LiPhify-release-signed.apk "$APK"
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/LiPhify-release-signed.apk
            rm -f "$APK" /tmp/release.jks
          else
            echo "Secrets keystore tidak ada — pakai APK unsigned apa adanya."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LiPhify-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish ke Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LiPhify v1.0.0" --notes "Build otomatis tiap push ke main."
          APK=$(ls app/build/outputs/apk/release/*-signed.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "Tidak ada APK signed (secrets kosong?) — skip publish."
            exit 0
          fi
          SHORT=$(git rev-parse --short HEAD)
          NAME="LiPhify-v1.0.0-${SHORT}-signed.apk"
          cp "$APK" "/tmp/$NAME"
          gh release upload "$TAG" "/tmp/$NAME" --clobber
          # Bersihkan asset lama, sisakan yang baru diupload
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep '^LiPhify-v1.0.0-.*-signed.apk$' | grep -v "^$NAME$"); do
            gh release delete-asset "$TAG" "$a" -y
          done
          gh release view "$TAG" --json assets -q '.assets[].name'

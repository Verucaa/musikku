name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept SDK licenses + install platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign APK (jika secrets tersedia)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            APK=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk | head -1)
            echo "Signing $APK"
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/release.jks \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out app/build/outputs/apk/release/LiPhify-release-signed.apk "$APK"
            rm /tmp/release.jks
          else
            echo "Secrets keystore tidak ada — pakai APK unsigned apa adanya."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LiPhify-release
          path: app/build/outputs/apk/release/*.apk

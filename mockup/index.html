<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiPhify — Mockup ala Apple Music (bukan app final)</title>
<style>
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E;
    --div:rgba(255,255,255,.08); --t1:#fff; --t2:rgba(255,255,255,.6);
    --t3:rgba(255,255,255,.4); --acc:#FA233B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#111;color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,Inter,"SF Pro","Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
  .phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
  .mocktag{background:#3a2b00;color:#ffd88a;font-size:11px;text-align:center;padding:5px 10px}
  .status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;font-size:14px;font-weight:600}
  header.big{padding:8px 16px 6px;font-size:34px;font-weight:700;letter-spacing:-.5px}
  main{flex:1;overflow-y:auto;padding-bottom:180px}
  section{padding:0 16px}
  h2.sec{font-size:20px;font-weight:700;margin:20px 0 8px}
  .sub{color:var(--t2);font-size:13px;margin-bottom:6px}
  /* library category rows ala Apple Music */
  .cat{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--div);cursor:pointer;font-size:17px}
  .cat:active{background:var(--card)}
  .glyph{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#FA233B,#c40e2b);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .cat .chev{margin-left:auto;color:var(--t3)}
  /* horizontal cards */
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px}
  .hcard{flex:0 0 150px;cursor:pointer}
  .hcard img{width:150px;height:150px;border-radius:10px;object-fit:cover}
  .hcard .t{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard .a{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero{flex:0 0 300px;border-radius:14px;padding:20px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;color:#fff}
  .hero small{opacity:.85;font-size:12px;font-weight:600;text-transform:uppercase}
  .hero h3{font-size:24px}
  /* song rows */
  .row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--div);cursor:pointer}
  .row img.cv{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0}
  .meta{flex:1;min-width:0}
  .meta .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots{background:none;border:none;color:var(--t2);font-size:18px;padding:4px 8px;cursor:pointer}
  /* browse grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
  .tile{border-radius:12px;padding:36px 12px 12px;font-weight:700;font-size:16px;cursor:pointer;position:relative;overflow:hidden}
  .tile span{position:relative}
  .tile::after{content:"♪";position:absolute;right:8px;bottom:2px;font-size:44px;opacity:.25}
  /* search */
  .sfield{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:10px 12px;margin:10px 0;color:var(--t3)}
  .sfield input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:16px}
  .scope{display:flex;background:var(--card2);border-radius:10px;padding:2px;margin:6px 0}
  .scope button{flex:1;background:none;border:none;color:#fff;font-size:14px;padding:7px;border-radius:8px;cursor:pointer}
  .scope button.on{background:#636366;font-weight:600}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:20px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;margin:12px 0}
  .empty{color:var(--t3);padding:14px 0;font-size:14px}
  /* bottom floating ala Liquid Glass */
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
  .mini{background:rgba(44,44,46,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:14px;overflow:hidden;margin-bottom:8px;cursor:pointer}
  .mini .in{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px}
  .mini img{width:44px;height:44px;border-radius:8px;object-fit:cover}
  .mini .meta .t{font-size:14px}.mini .meta .a{font-size:12px}
  .mini .bar{height:2px;background:rgba(255,255,255,.25)}
  .mini .bar i{display:block;height:100%;background:var(--t2)}
  .iconbtn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px}
  .tabbar{background:rgba(28,28,30,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:8px 4px}
  .tab{background:none;border:none;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px}
  .tab .i{font-size:23px}.tab.on{color:var(--acc)}
  .searchfab{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:20px;cursor:pointer}
  /* now playing */
  #np{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 20px 26px;z-index:30}
  #np.open{display:flex}
  #npBg{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#111}
  #npBg img{width:100%;height:100%;object-fit:cover;filter:blur(60px) brightness(.55);transform:scale(1.2)}
  .np-top{display:flex;justify-content:space-between;align-items:center;color:#fff}
  #npArt{width:min(78vw,320px);aspect-ratio:1;border-radius:12px;margin:18px auto 16px;object-fit:cover;display:block;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .np-titlerow{display:flex;align-items:center;gap:10px}
  .np-titlerow .meta .t{font-size:20px;font-weight:600}
  .np-titlerow .meta .a{font-size:19px}
  input[type=range]{width:100%;accent-color:rgba(255,255,255,.9);height:24px}
  .times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6)}
  .ctrl{display:flex;justify-content:space-between;align-items:center;margin:8px 8px 0}
  .ctrl .iconbtn{font-size:34px}.ctrl .play{font-size:76px}
  .vol{display:flex;align-items:center;gap:8px;margin-top:10px;color:rgba(255,255,255,.7)}
  .vol input{flex:1}
  .np-foot{display:flex;justify-content:space-between;margin:14px 26px 0}
  .np-foot .iconbtn{font-size:24px;opacity:.85}.np-foot .dim{opacity:.35}
  /* up next */
  #up{position:absolute;left:0;right:0;bottom:0;top:110px;background:rgba(20,20,22,.96);backdrop-filter:blur(30px);z-index:35;border-radius:18px 18px 0 0;padding:12px 18px 30px;display:none;overflow-y:auto}
  #up.open{display:block}
  #up .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:0 auto 10px}
  .sr-row{display:flex;gap:10px;margin:10px 0}
  .sr-row button{flex:1;background:var(--card2);border:none;color:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
  .sr-row button.on{background:var(--acc)}
  /* action sheet ala iOS */
  #sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;display:none}
  #sheet.open{display:block}
  #sheet .card{background:rgba(44,44,46,.94);border-radius:16px;overflow:hidden;margin-bottom:8px}
  #sheet .sh-head{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--div)}
  #sheet .sh-head img{width:52px;height:52px;border-radius:8px;object-fit:cover}
  #sheet button.arow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;color:#fff;font-size:16px;padding:13px 16px;border-bottom:1px solid var(--div);cursor:pointer}
  #sheet button.arow:last-child{border-bottom:none}
  #sheet button.cancel{width:100%;background:rgba(44,44,46,.94);border:none;color:var(--acc);font-size:17px;font-weight:600;padding:15px;border-radius:16px;cursor:pointer}
  #toast{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);background:var(--card2);padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:50;white-space:nowrap}
</style>
</head>
<body>
<div class="phone">
  <div class="mocktag">MOCKUP HTML ala Apple Music — data contoh, bukan data asli</div>
  <div class="status"><span>9:41</span><span>●●● 📶 🔋</span></div>
  <header class="big" id="hdr">Library</header>
  <main id="screen"></main>

  <div class="bottom">
    <div class="mini" id="mini" style="display:none" onclick="openNP()">
      <div class="in">
        <img id="miniArt" alt="">
        <div class="meta"><div class="t" id="miniT">–</div><div class="a" id="miniA">–</div></div>
        <button class="iconbtn" onclick="event.stopPropagation();toggle()">▶</button>
        <button class="iconbtn" onclick="event.stopPropagation();next()">⏭</button>
      </div>
      <div class="bar"><i id="miniBar" style="width:0%"></i></div>
    </div>
    <div class="tabbar">
      <button class="tab" data-t="home" onclick="go('home')"><span class="i">⌂</span>Home</button>
      <button class="tab" data-t="new" onclick="go('new')"><span class="i">✦</span>New</button>
      <button class="tab" data-t="library" onclick="go('library')"><span class="i">▤</span>Library</button>
      <button class="searchfab" onclick="go('search')">🔍</button>
    </div>
  </div>

  <div id="np">
    <div id="npBg"><img id="npBgImg" alt=""></div>
    <div class="np-top">
      <button class="iconbtn" onclick="closeNP()">▾</button>
      <button class="iconbtn" onclick="openSheet(curIdx())">⋯</button>
    </div>
    <img id="npArt" alt="">
    <div class="np-titlerow">
      <div class="meta"><div class="t" id="npTitle">–</div><div class="a" id="npArtist">–</div></div>
      <button class="dots" onclick="openSheet(curIdx())">⋯</button>
    </div>
    <div style="margin-top:10px">
      <input type="range" id="seek" min="0" max="100" value="0" oninput="seekTo(this.value)">
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrl">
      <span style="width:34px"></span>
      <button class="iconbtn" onclick="prev()">⏮</button>
      <button class="iconbtn play" id="ppBtn" onclick="toggle()">▶</button>
      <button class="iconbtn" onclick="next()">⏭</button>
      <span style="width:34px"></span>
    </div>
    <div class="vol">🔈<input type="range" min="0" max="100" value="70"><span>🔊</span></div>
    <div class="np-foot">
      <button class="iconbtn dim" onclick="toast('Lirik belum tersedia')">💬</button>
      <button class="iconbtn dim" onclick="toast('AirPlay: hanya di app final')">◎</button>
      <button class="iconbtn" onclick="toggleUp(true)">☰</button>
    </div>
    <div id="up">
      <div class="grab"></div>
      <h2 class="sec" style="margin-top:0">Playing Next</h2>
      <div class="sr-row">
        <button id="shBtn" onclick="toggleSh()">🔀 Shuffle Off</button>
        <button id="rpBtn" onclick="cycleRp()">🔁 Repeat Off</button>
      </div>
      <div id="upList"></div>
      <button class="btn" style="width:100%" onclick="toggleUp(false)">Tutup</button>
    </div>
  </div>

  <div id="sheet">
    <div class="card">
      <div class="sh-head"><img id="shArt" alt=""><div class="meta"><div class="t" id="shT"></div><div class="a" id="shA"></div></div></div>
      <div id="shActs"></div>
    </div>
    <button class="cancel" onclick="closeSheet()">Cancel</button>
  </div>
  <div id="toast"></div>
</div>

<script>
const C=[["#7b2ff7","#f72f8f"],["#11998e","#38ef7d"],["#fc4a1a","#f7b733"],["#4a00e0","#8e2de2"],["#0f2027","#2c5364"],["#c40e2b","#5b0e1e"]];
const SONGS=[
  {t:"Neon Skyline",a:"Midnight Circuit",al:"Afterglow",d:214,c:0,src:"Perangkat"},
  {t:"Sawah Pagi",a:"Arum",al:"Lokal",d:189,c:1,src:"Perangkat"},
  {t:"Blinding Lights",a:"The Weeknd",al:"After Hours",d:202,c:2,src:"YouTube Music"},
  {t:"Levitating",a:"Dua Lipa",al:"Future Nostalgia",d:203,c:3,src:"YouTube Music"},
  {t:"Garam & Madu",a:"Tenxi",al:"Demo",d:176,c:4,src:"Perangkat"},
  {t:"Espresso",a:"Sabrina Carpenter",al:"Short n' Sweet",d:175,c:5,src:"YouTube Music"},
  {t:"Blue Hour",a:"Ambient Works",al:"Fokus",d:240,c:1,src:"Perangkat"},
  {t:"Viva la Vida",a:"Coldplay",al:"Viva la Vida",d:242,c:3,src:"YouTube Music"},
];
const GENRES=[["Pop","#fc5c7d","#6a82fb"],["Hip-Hop","#f7b733","#fc4a1a"],["R&B","#8e2de2","#4a00e0"],["Electronic","#11998e","#38ef7d"],["Rock","#232526","#414345"],["Jazz","#c79081","#dfa579"],["Classical","#0f2027","#2c5364"],["Metal","#000000","#434343"]];
let queue=[0,2],qi=0,playing=false,pos=0,sh=false,rp=0,tab="library",sheetIdx=null;
let playlists=[{n:"Favorit",items:[0]}];
const $=id=>document.getElementById(id);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function cover(s){
  const[c1,c2]=C[s.c],h=[...s.t].reduce((a,c)=>a+c.charCodeAt(0),0);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="160" height="160" fill="url(#g)"/><circle cx="${h%120+20}" cy="${(h*7)%100+20}" r="${24+(h%34)}" fill="white" opacity="0.16"/><circle cx="${(h*13)%130+10}" cy="${(h*3)%110+30}" r="${14+(h%24)}" fill="black" opacity="0.22"/><rect x="16" y="122" width="16" height="${16+(h%22)}" rx="4" fill="white" opacity="0.55"/><rect x="40" y="112" width="16" height="${26+(h%30)}" rx="4" fill="white" opacity="0.55"/><rect x="64" y="126" width="16" height="${12+(h%18)}" rx="4" fill="white" opacity="0.55"/><text x="80" y="92" font-family="sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="white">${s.t[0]}</text></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function go(t,arg){
  tab=t;closeSheet();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("hdr").textContent={home:"Home",new:"New",library:"Library",search:"Search"}[t];
  ({home:renderHome,new:renderNew,library:renderLibrary,search:()=>renderSearch(arg||"")})[t]();
}
function row(i){
  const s=SONGS[i];
  return `<div class="row" onclick="playAt(${i})"><img class="cv" src="${cover(s)}"><div class="meta"><div class="t">${s.t}</div><div class="a">${s.a}</div></div><button class="dots" onclick="event.stopPropagation();openSheet(${i})">⋯</button></div>`;
}
function hcard(i){
  const s=SONGS[i];
  return `<div class="hcard" onclick="playAt(${i})"><img src="${cover(s)}"><div class="t">${s.t}</div><div class="a">${s.a}</div></div>`;
}
/* screens */
function renderLibrary(){
  const arts=[...new Set(SONGS.map(s=>s.a))],albs=[...new Set(SONGS.map(s=>s.al))];
  const cats=[["🎧","Playlists",playlists.length],["🎤","Artists",arts.length],["💿","Albums",albs.length],["🎵","Songs",SONGS.length],["⬇","Downloaded",0]];
  $("screen").innerHTML=`<section>
    ${cats.map(c=>`<div class="cat" onclick="toast('${c[1]} (${c[2]}) — mockup')"><div class="glyph">${c[0]}</div>${c[1]}<span class="chev">›</span></div>`).join("")}
    <h2 class="sec">Recently Added</h2><div class="sub">ORDER BY dateAdded DESC di app final</div>
    <div class="hscroll">${[4,1,5,0].map(hcard).join("")}</div>
    <h2 class="sec">Songs • ${SONGS.length}</h2>
    ${SONGS.map((_,i)=>row(i)).join("")}</section>`;
}
function renderHome(){
  $("screen").innerHTML=`<section>
    <h2 class="sec">Top Picks</h2>
    <div class="hscroll">
      <div class="hero" style="background:linear-gradient(135deg,#7b2ff7,#f72f8f)" onclick="playAt(2)"><small>STATIC PER PRD-007</small><h3>New Music Mix</h3></div>
      <div class="hero" style="background:linear-gradient(135deg,#11998e,#38ef7d)" onclick="playAt(6)"><small>STATIC PER PRD-007</small><h3>Fokus Pagi</h3></div>
    </div>
    <h2 class="sec">Recently Played</h2><div class="sub">Dari tabel history Room di app final</div>
    <div class="hscroll">${queue.map(hcard).join("")}</div>
    <h2 class="sec">New Music</h2>
    ${[5,3,7].map(row).join("")}</section>`;
}
function renderNew(){
  $("screen").innerHTML=`<section><h2 class="sec">Browse Categories</h2><div class="sub">Tap genre → query nyata ke Search di app final</div>
    <div class="grid2">${GENRES.map(g=>`<div class="tile" style="background:linear-gradient(135deg,${g[1]},${g[2]})" onclick="go('search','${g[0]}')"><span>${g[0]}</span></div>`).join("")}</div></section>`;
}
function renderSearch(preset){
  $("screen").innerHTML=`<section>
    <div class="sfield">🔍<input id="q" placeholder="Search" value="${preset}" oninput="doSearch(this.value)"></div>
    <div id="res"></div></section>`;
  doSearch(preset);
}
function doSearch(q){
  q=q.trim().toLowerCase();const box=$("res");if(!box)return;
  if(!q){box.innerHTML=`<h2 class="sec">Browse Categories</h2><div class="grid2">${GENRES.slice(0,4).map(g=>`<div class="tile" style="background:linear-gradient(135deg,${g[1]},${g[2]})" onclick="document.getElementById(&quot;q&quot;).value='${g[0]}';doSearch('${g[0]}')"><span>${g[0]}</span></div>`).join("")}</div>`;return;}
  const hit=SONGS.map((s,i)=>({s,i})).filter(x=>(x.s.t+" "+x.s.a+" "+x.s.al).toLowerCase().includes(q));
  const loc=hit.filter(x=>x.s.src==="Perangkat"),yt=hit.filter(x=>x.s.src!=="Perangkat");
  box.innerHTML=`<div class="scope"><button class="on">LiPhify</button><button onclick="toast('Scope: hasil digabung per section')">Perangkat</button></div>
    <h2 class="sec">Di Perangkat</h2>${loc.length?loc.map(x=>row(x.i)).join(""):'<div class="empty">Tidak ada hasil lokal</div>'}
    <h2 class="sec">YouTube Music</h2>${yt.length?yt.map(x=>row(x.i)).join(""):'<div class="empty">Tidak ada hasil YouTube</div>'}`;
}
/* player */
function cur(){return SONGS[queue[qi]];}
function curIdx(){return queue[qi];}
function syncMini(){
  const m=$("mini");if(cur()===undefined){m.style.display="none";return;}
  m.style.display="block";$("miniT").textContent=cur().t;$("miniA").textContent=cur().a;
  $("miniArt").src=cover(cur());$("miniBar").style.width=(cur().d?pos/cur().d*100:0)+"%";
  document.querySelector("#mini .in .iconbtn").textContent=playing?"⏸":"▶";
}
function playAt(i){
  let k=queue.indexOf(i);if(k<0){queue.push(i);k=queue.length-1;}
  qi=k;pos=0;playing=true;syncMini();if($("np").classList.contains("open"))syncNP();
}
function toggle(){if(cur()===undefined)return;playing=!playing;syncMini();syncNP();}
function next(){if(!queue.length)return;qi=sh?Math.floor(Math.random()*queue.length):(qi+1)%queue.length;pos=0;playing=true;syncMini();syncNP();}
function prev(){if(!queue.length)return;qi=(qi-1+queue.length)%queue.length;pos=0;playing=true;syncMini();syncNP();}
function toggleSh(){sh=!sh;$("shBtn").textContent=sh?"🔀 Shuffle On":"🔀 Shuffle Off";$("shBtn").classList.toggle("on",sh);}
function cycleRp(){rp=(rp+1)%3;$("rpBtn").textContent=["🔁 Repeat Off","🔂 Repeat One","🔁 Repeat All"][rp];}
function seekTo(v){if(cur()===undefined)return;pos=v/100*cur().d;syncNP();}
setInterval(()=>{if(playing&&cur()!==undefined){pos+=1;if(pos>=cur().d){if(rp===1){pos=0;}else next();}syncMini();if($("np").classList.contains("open"))syncNP();}},1000);
function openNP(){if(cur()===undefined)return;toggleUp(false);$("np").classList.add("open");syncNP();}
function closeNP(){$("np").classList.remove("open");}
function syncNP(){
  const s=cur();if(s===undefined)return;
  $("npTitle").textContent=s.t;$("npArtist").textContent=s.a;
  $("npArt").src=cover(s);$("npBgImg").src=cover(s);
  $("dur").textContent="−"+fmt(Math.max(0,s.d-pos));$("pos").textContent=fmt(pos);
  $("seek").value=s.d?pos/s.d*100:0;$("ppBtn").textContent=playing?"⏸":"▶";
  renderUp();
}
function toggleUp(open){
  $("up").classList.toggle("open",open);
  if(open)renderUp();
}
function renderUp(){
  $("upList").innerHTML=queue.map((idx,k)=>{const s=SONGS[idx];
    return `<div class="row" style="${k===qi?"color:var(--acc)":""}" onclick="qi=${k};pos=0;playing=true;syncMini();syncNP()"><img class="cv" src="${cover(s)}"><div class="meta"><div class="t">${s.t}</div><div class="a">${s.a}</div></div><button class="dots" onclick="event.stopPropagation();mvUp(${k},-1)">↑</button><button class="dots" onclick="event.stopPropagation();mvUp(${k},1)">↓</button></div>`;}).join("");
}
function mvUp(k,d){const j=k+d;if(j<0||j>=queue.length)return;[queue[k],queue[j]]=[queue[j],queue[k]];if(qi===k)qi=j;else if(qi===j)qi=k;renderUp();syncMini();}
/* action sheet ala iOS */
function openSheet(i){
  sheetIdx=i;const s=SONGS[i];
  $("shArt").src=cover(s);$("shT").textContent=s.t;$("shA").textContent=s.a+" • "+s.src;
  $("shActs").innerHTML=
    `<button class="arow" onclick="sheetGo('next')">▶&nbsp;&nbsp;Play Next</button>
     <button class="arow" onclick="sheetGo('last')">＋&nbsp;&nbsp;Play Last</button>
     <button class="arow" onclick="sheetGo('pl')">📁&nbsp;&nbsp;Add to Playlist…</button>
     <div id="plPick"></div>`;
  $("sheet").classList.add("open");
}
function closeSheet(){$("sheet").classList.remove("open");}
function sheetGo(k){
  if(k==="next"){const p=queue.indexOf(sheetIdx);if(p>=0)queue.splice(p,1);queue.splice(qi+1,0,sheetIdx);toast("Play Next ✓");}
  if(k==="last"){if(!queue.includes(sheetIdx))queue.push(sheetIdx);toast("Play Last ✓");}
  if(k==="pl"){
    $("plPick").innerHTML=playlists.map((x,n)=>`<button class="arow" onclick="addPl(${n})">📁&nbsp;&nbsp;${x.n}</button>`).join("")+`<button class="arow" style="color:var(--acc)" onclick="addPl(-1)">＋&nbsp;&nbsp;New Playlist…</button>`;
    return;
  }
  closeSheet();syncMini();if($("np").classList.contains("open"))syncNP();
}
function addPl(n){
  if(n<0){const nm=prompt("Nama playlist:","Baru");if(!nm)return;playlists.push({n:nm,items:[]});n=playlists.length-1;}
  playlists[n].items.push(sheetIdx);toast("→ "+playlists[n].n+" ✓");closeSheet();
}
go("library");
</script>
</body>
</html>
